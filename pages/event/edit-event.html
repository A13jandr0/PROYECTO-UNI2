<!-- Scripts de animaciones y funcionalidad -->
  <script>
    // Variables globales para el manejo de imágenes
    let selectedImages = [];

    // Animación de entrada progresiva
    document.addEventListener('DOMContentLoaded', function() {
      const fieldGroups = document.querySelectorAll('.field-group');
      fieldGroups.forEach((group, index) => {
        group.style.opacity = '0';
        group.style.transform = 'translateX(-30px)';
        
        setTimeout(() => {
          group.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
          group.style.opacity = '1';
          group.style.transform = 'translateX(0)';
        }, index * 100);
      });

      // Configurar el manejo de imágenes inmediatamente
      setupImageHandling();
    });

    // Configuración del manejo de imágenes
    function setupImageHandling() {
      const fileInput = document.getElementById('imagenes');
      const previewContainer = document.getElementById('imagePreviewContainer');
      const fileInputLabel = document.querySelector('.file-input-professional');

      // Evento de cambio en el input de archivos
      fileInput.addEventListener('change', function(e) {
        handleFileSelection(e.target.files);
      });

      // Drag and drop
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        fileInputLabel.addEventListener(eventName, preventDefaults, false);
      });

      ['dragenter', 'dragover'].forEach(eventName => {
        fileInputLabel.addEventListener(eventName, highlight, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        fileInputLabel.addEventListener(eventName, unhighlight, false);
      });

      fileInputLabel.addEventListener('drop', function(e) {
        handleFileSelection(e.dataTransfer.files);
      }, false);
    }

    // Manejar selección de archivos
    function handleFileSelection(files) {
      const filesArray = Array.from(files);
      const previewContainer = document.getElementById('imagePreviewContainer');
      
      if (filesArray.length > 0) {
        selectedImages = filesArray;
        showImagePreviews(filesArray);
        previewContainer.style.display = 'grid';
      } else {
        previewContainer.style.display = 'none';
        selectedImages = [];
      }
    }

    // Mostrar previews de imágenes
    function showImagePreviews(files) {
      const previewContainer = document.getElementById('imagePreviewContainer');
      previewContainer.innerHTML = '';
      
      files.forEach((file, index) => {
        // Verificar que sea una imagen
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          
          reader.onload = function(e) {
            const imagePreview = document.createElement('div');
            imagePreview.className = 'image-preview';
            imagePreview.innerHTML = `
              <img src="${e.target.result}" alt="Preview ${index + 1}" style="width: 100%; height: 100%; object-fit: cover;">
              <button type="button" class="remove-btn" onclick="removeImage(${index})" title="Eliminar imagen">×</button>
            `;
            previewContainer.appendChild(imagePreview);
          };
          
          reader.onerror = function() {
            console.error('Error al leer el archivo:', file.name);
          };
          
          reader.readAsDataURL(file);
        }
      });
    }

    // Función para remover imagen
    function removeImage(index) {
      selectedImages.splice(index, 1);
      
      // Crear un nuevo FileList con las imágenes restantes
      const dt = new DataTransfer();
      selectedImages.forEach(file => dt.items.add(file));
      document.getElementById('imagenes').files = dt.files;
      
      // Actualizar preview
      if (selectedImages.length > 0) {
        showImagePreviews(selectedImages);
      } else {
        document.getElementById('imagePreviewContainer').style.display = 'none';
      }
    }

    // Funciones de drag and drop
    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    function highlight() {
      const fileInput = document.querySelector('.file-input-professional');
      fileInput.style.borderColor = 'var(--primary-green)';
      fileInput.style.background = 'linear-gradient(135deg, rgba(116, 166, 41, 0.1) 0%, rgba(136, 191, 54, 0.05) 100%)';
      fileInput.style.transform = 'translateY(-4px) scale(1.02)';
    }

    function unhighlight() {
      const fileInput = document.querySelector('.file-input-professional');
      fileInput.style.borderColor = 'var(--secondary-teal)';
      fileInput.style.background = 'linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(248, 250, 252, 0.8) 100%)';
      fileInput.style.transform = 'translateY(0) scale(1)';
    }

    // Efectos de foco mejorados
    document.querySelectorAll('.professional-input, .professional-textarea, .professional-select').forEach(input => {
      input.addEventListener('focus', function() {
        this.style.transform = 'translateY(-2px) scale(1.01)';
      });
      
      input.addEventListener('blur', function() {
        this.style.transform = 'translateY(0) scale(1)';
      });
    });

        <label for="imagenes" class="file-input-professional">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="var(--secondary-teal)" style="margin: 0 auto 16px;">
            <path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/>
          </svg>
          <div style="color: var(--dark); font-weight: 700; margin-bottom: 8px; font-size: 18px;">Seleccionar imágenes</div>
          <div style="color: #6b7280; font-size: 15px;">Arrastra archivos aquí o haz clic para seleccionar</div>
          <input id="imagenes" name="nuevasImagenes" type="file" accept="image/*" multiple>
        </label>
        <div id="imagePreviewContainer" class="image-preview-container" style="display: none;"></div>
      </div>

      <!-- Descripción -->
      <div class="field-group">
        <label for="descripcion" class="professional-label">
          <svg class="label-icon" viewBox="0 0 24 24">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
          </svg>
          Descripción del evento
        </label>
        <textarea id="descripcion" name="descripcion" class="professional-textarea" placeholder="Describe tu evento..."></textarea>
      </div>

      <!-- Fechas -->
      <div class="field-group">
        <label class="professional-label">
          <svg class="label-icon" viewBox="0 0 24 24">
            <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
          </svg>
          Fechas del evento
        </label>
        <div class="grid-responsive grid-3">
          <div>
            <label for="fechaInicio" class="block text-sm font-medium mb-2 text-gray-600">Inicio *</label>
            <input id="fechaInicio" name="fechaInicio" type="datetime-local" required class="professional-input">
          </div>
          <div>
            <label for="fechaFinal" class="block text-sm font-medium mb-2 text-gray-600">Final</label>
            <input id="fechaFinal" name="fechaFinal" type="datetime-local" class="professional-input">
          </div>
          <div>
            <label for="fechaLimiteInscripcion" class="block text-sm font-medium mb-2 text-gray-600">Límite inscripción</label>
            <input id="fechaLimiteInscripcion" name="fechaLimiteInscripcion" type="datetime-local" class="professional-input">
          </div>
        </div>
      </div>

      <!-- Mapa -->
      <div class="field-group">
        <label class="professional-label">
          <svg class="label-icon" viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          Ubicación del evento
        </label>
        <div id="map" class="map-container"></div>
        <input type="hidden" id="lat" name="locacion[lat]">
        <input type="hidden" id="lng" name="locacion[lng]">
      </div>

      <!-- Dirección / ciudad -->
      <div class="field-group">
        <div class="grid-responsive grid-2">
          <div>
            <label for="direccion" class="professional-label">
              <svg class="label-icon" viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
              </svg>
              Dirección
            </label>
            <input id="direccion" name="locacion[direccion]" class="professional-input" placeholder="Dirección del evento">
          </div>
          <div>
            <label for="ciudad" class="professional-label">
              <svg class="label-icon" viewBox="0 0 24 24">
                <path d="M15 11V5l-3-3-3 3v2H3v14h18V11h-6zm-8 8H5v-2h2v2zm0-4H5v-2h2v2zm0-4H5V9h2v2zm6 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zm0-4h-2V5h2v2zm6 12h-2v-2h2v2zm0-4h-2v-2h2v2z"/>
              </svg>
              Ciudad
            </label>
            <input id="ciudad" name="locacion[ciudad]" class="professional-input" placeholder="Ciudad del evento">
          </div>
        </div>
      </div>

      <!-- Tipo, capacidad, estado, inscripción -->
      <div class="field-group">
        <div class="grid-responsive grid-2">
          <div>
            <label for="tipoEvento" class="professional-label">
              <svg class="label-icon" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
              </svg>
              Tipo de evento
            </label>
            <select id="tipoEvento" name="tipoEvento" required class="professional-select">
              <option value="conferencia">Conferencia</option>
              <option value="taller">Taller</option>
              <option value="seminario">Seminario</option>
              <option value="capacitacion">Capacitación</option>
              <option value="voluntariado">Voluntariado</option>
              <option value="fundraising">Recaudación de fondos</option>
              <option value="cultural">Cultural</option>
              <option value="deportivo">Deportivo</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          <div>
            <label for="capacidadMaxima" class="professional-label">
              <svg class="label-icon" viewBox="0 0 24 24">
                <path d="M16 4c0-1.11.89-2 2-2s2 .89 2 2-.89 2-2 2-2-.89-2-2zm4 18v-6h2.5l-2.54-7.63A1.5 1.5 0 0 0 18.54 8H17c-.8 0-1.5.7-1.5 1.5v8c0 .83.67 1.5 1.5 1.5h1v3h2zm-12.5 0c.83 0 1.5-.67 1.5-1.5v-9c0-.83-.67-1.5-1.5-1.5S6 10.67 6 11.5v9c0 .83.67 1.5 1.5 1.5zm3-16C10.5 3.78 8.22 2 5.5 2S.5 3.78.5 6s2.28 4 5 4 5-1.78 5-4z"/>
              </svg>
              Capacidad máxima
            </label>
            <input id="capacidadMaxima" name="capacidadMaxima" type="number" min="1" class="professional-input" placeholder="Número de participantes">
          </div>

          <div>
            <label for="estado" class="professional-label">
              <svg class="label-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
              Estado del evento
            </label>
            <select id="estado" name="estado" required class="professional-select">
              <option value="borrador">Borrador</option>
              <option value="publicado">Publicado</option>
              <option value="en_curso">En curso</option>
              <option value="finalizado">Finalizado</option>
              <option value="suspendido">Suspendido</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </div>

          <div class="flex items-end">
            <div class="checkbox-professional">
              <input id="inscripcionAbierta" name="inscripcionAbierta" type="checkbox" class="h-5 w-5 text-cyan-600 rounded border-gray-300 focus:ring-cyan-500">
              <label for="inscripcionAbierta" class="text-sm font-medium text-gray-700">Inscripción abierta</label>
            </div>
          </div>
        </div>
      </div>

      <!-- Botones -->
      <div class="field-group">
        <div class="flex flex-wrap gap-4 justify-end">
          <button id="btnCancelar" type="button" class="btn-secondary-professional">
            Cancelar
          </button>
          <button id="btnGuardar" type="submit" class="btn-primary-professional">
            Guardar cambios
          </button>
        </div>
      </div>
    </form>
  </main>

  <!-- Leaflet & lógica -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script defer src="../../scripts/events/edit-event.js"></script>

  <!-- Scripts de animaciones -->
  <script>
    // Animación de entrada progresiva
    document.addEventListener('DOMContentLoaded', function() {
      const fieldGroups = document.querySelectorAll('.field-group');
      fieldGroups.forEach((group, index) => {
        group.style.opacity = '0';
        group.style.transform = 'translateX(-30px)';
        
        setTimeout(() => {
          group.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
          group.style.opacity = '1';
          group.style.transform = 'translateX(0)';
        }, index * 100);
      });
    });

    // Efectos de foco mejorados
    document.querySelectorAll('.professional-input, .professional-textarea, .professional-select').forEach(input => {
      input.addEventListener('focus', function() {
        this.style.transform = 'translateY(-1px)';
      });
      
      input.addEventListener('blur', function() {
        this.style.transform = 'translateY(0)';
      });
    });
  </script>
</body>
</html>
