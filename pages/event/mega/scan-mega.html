<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Check-In Mega-Evento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="../../assets/js/config.js"></script>
  <script defer src="../../scripts/events/scan-mega.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <form id="checkInForm" class="bg-white p-6 rounded-lg shadow space-y-4 w-full max-w-sm">
    <h1 class="text-xl font-bold text-center">Formulario de Asistencia</h1>
    <input type="email" id="email" placeholder="Correo electrónico" required
           class="w-full px-3 py-2 border rounded" />
    <label class="flex items-center gap-2">
      <input type="checkbox" id="asiste" />
      Confirmo mi asistencia
    </label>
    <p id="msg" class="text-center text-sm h-6"></p>
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
      Enviar
    </button>
  </form>
</body>
</html>
