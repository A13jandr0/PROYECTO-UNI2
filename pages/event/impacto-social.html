<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Impacto social</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="../../assets/js/config.js"></script>
  <script defer src="../../scripts/events/impacto-social.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-indigo-800 min-h-screen flex items-center justify-center p-4">
  <section class="w-full max-w-lg bg-white/90 rounded-3xl shadow-lg p-6 space-y-6">
    <header class="flex items-center gap-3">
      <button onclick="history.back()"
              class="rounded-full bg-cyan-500 hover:bg-cyan-600 text-white w-8 h-8 grid place-content-center">←</button>
      <h1 id="titulo" class="text-xl font-bold flex-1 truncate">Impacto social</h1>
    </header>

    <div id="stats" class="space-y-4 text-gray-800">
      <p class="text-center text-gray-500">Cargando…</p>
    </div>
    <hr class="border-gray-300">
    <div id="commentsStats" class="space-y-4 text-gray-800">
     <p class="text-center text-gray-500">Cargando comentarios…</p>
    </div>
  </section>
</body>
</html>
