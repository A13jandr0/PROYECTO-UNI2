<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNI2 • Participantes del evento</title>

  <!-- Tailwind (o tu build local) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col bg-gradient-to-br from-blue-900 to-indigo-800 text-gray-800 font-sans">

  <!-- Barra superior -->
  <header class="bg-white/90 backdrop-blur-sm shadow-md sticky top-0 z-20">
    <div class="max-w-5xl mx-auto flex items-center gap-4 px-4 py-3">
      <button id="volverBtn"
              class="rounded-full bg-cyan-500 hover:bg-cyan-600 text-white w-9 h-9 grid place-content-center shadow">
        ←
      </button>
      <h1 class="font-bold text-lg truncate flex-1">Participantes del evento</h1>
    </div>
  </header>

  <!-- Contenido -->
  <main class="flex-grow max-w-5xl mx-auto px-4 py-8">

    <!-- Avisos -->
    <p id="mensajeContainer" class="mb-6 text-center text-red-600"></p>

    <!-- Métricas -->
    <section id="metricasContainer" class="hidden mb-10">
      <h2 class="text-lg font-semibold text-white drop-shadow mb-4">Métricas de participación</h2>

      <div class="grid gap-6 sm:grid-cols-3">
        <article class="bg-white/90 rounded-2xl shadow p-6 text-center">
          <p class="text-sm text-gray-500">Total inscritos</p>
          <p id="totalInscritos" class="text-3xl font-bold text-indigo-700">–</p>
        </article>

        <article class="bg-white/90 rounded-2xl shadow p-6 text-center">
          <p class="text-sm text-gray-500">Total asistentes</p>
          <p id="totalAsistentes" class="text-3xl font-bold text-indigo-700">–</p>
        </article>

        <article class="bg-white/90 rounded-2xl shadow p-6 text-center">
          <p class="text-sm text-gray-500">% asistencia</p>
          <p id="porcentajeAsistencia" class="text-3xl font-bold text-indigo-700">–</p>
        </article>
      </div>
    </section>

    <!-- Lista -->
    <section id="participantesContainer" class="hidden">
      <h2 class="text-lg font-semibold text-white drop-shadow mb-4">Lista de participantes</h2>

      <div class="overflow-x-auto rounded-2xl shadow ring-1 ring-gray-200 bg-white/90">
        <table class="min-w-full text-sm">
          <thead class="bg-gray-100 text-gray-700">
            <tr>
              <th class="py-3 px-4 text-left font-medium">#</th>
              <th class="py-3 px-4 text-left font-medium">ID integrante</th>
              <th class="py-3 px-4 text-left font-medium">Tipo</th>
              <th class="py-3 px-4 text-left font-medium">Asistencia</th>
            </tr>
          </thead>
          <tbody id="participantesBody" class="[&>tr:nth-child(even)]:bg-gray-50">
            <!-- Relleno dinámico -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Config + lógica -->
  <script src="../../assets/js/config.js"></script>
  <script defer src="../../scripts/events/participantes-evento.js"></script>
</body>
</html>
