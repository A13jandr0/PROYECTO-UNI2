
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Actualizar Perfil</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- define API_BASE_URL en este script -->
  <script src="../../assets/js/config.js"></script>
  
  <style>
    /* Animación de carga */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
    
    .pulse-ring {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    /* Custom file input */
    input[type="file"]::file-selector-button {
      @apply hidden;
    }
    
    /* Custom checkbox */
    input[type="checkbox"] {
      @apply w-5 h-5 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer;
    }
    
    /* Smooth transitions */
    * {
      transition: all 0.2s ease;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-gray-50 via-white to-blue-50 min-h-screen">
  <div class="container mx-auto px-4 py-8 max-w-2xl">
    <!-- Header -->

      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">

        </svg>

    <!-- Formulario -->

      <!-- Sección Avatar -->

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          Foto de Perfil
        </h3>
        
        <div class="flex items-center space-x-6">
          <!-- Preview -->

            <img id="avatarPreviewImg" src="" alt="Avatar actual"

                 style="display:none">

                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>

          <!-- Upload button -->

                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
              </svg>

      </div>

      <!-- Sección Banner (Solo para Empresas) -->

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>

          <div>

              Número de teléfono

            <input type="text" id="phoneInput" name="PhoneNumber" 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200" />

<script>
(async () => {
  const token = localStorage.getItem('token');
  const status = document.getElementById('status');
  if (!token) {
    showStatus('No autenticado. Inicia sesión.', 'error');
    return;
  }

  function showStatus(message, type = 'info') {
    status.style.opacity = '1';
    status.textContent = message;
    status.className = 'mb-6 p-4 rounded-lg text-center font-medium transition-all duration-300';
    
    switch(type) {
      case 'error':
        status.className += ' bg-red-100 text-red-700 border border-red-200';
        break;
      case 'success':
        status.className += ' bg-green-100 text-green-700 border border-green-200';
        break;
      case 'loading':
        status.className += ' bg-blue-100 text-blue-700 border border-blue-200 pulse-ring';
        break;
      default:
        status.className += ' bg-gray-100 text-gray-700 border border-gray-200';
    }
    
    if (type !== 'loading') {
      setTimeout(() => { status.style.opacity = '0'; }, 5000);
    }
  }

  /* ── Cargar perfil ───────────────────────── */
  let user;
  try {
    const res  = await fetch(`${API_BASE_URL}/api/users/profile`, {
      headers:{ Authorization:`Bearer ${token}` }
    });
    const json = await res.json();
    if (!res.ok || !json.success) throw new Error(json.error || 'Error');
    user = json.user;
  } catch (e) {
    showStatus('Error al cargar: ' + e.message, 'error');
    return;
  }

  /* ── Pre-rellenar ────────────────────────── */
  document.getElementById('nombreInput').value = user.nombre_usuario || '';
  document.getElementById('correoInput').value = user.correo         || '';

  const pref = user.preferencias || {};


  // avatar preview si viene
  if (user.avatar) {
    const img = document.getElementById('avatarPreviewImg');
    const placeholder = document.getElementById('avatarPlaceholder');
    img.src = user.avatar;
    img.style.display = 'block';
    placeholder.style.display = 'none';
  }


  // NUEVO - banner preview para empresas
  if (user.tipo_usuario === 'Empresa') {
    document.getElementById('bannerSection').style.display = 'block';
    
    if (user.banner) {
      const bannerImg = document.getElementById('bannerPreviewImg');
      const bannerPlaceholder = document.getElementById('bannerPlaceholder');
      const deleteBtn = document.getElementById('deleteBannerBtn');
      
      bannerImg.src = user.banner;
      bannerImg.style.display = 'block';
      bannerPlaceholder.style.display = 'none';
      deleteBtn.style.display = 'inline-flex';
    }
  }

  // datos Empresa
  if (user.tipo_usuario === 'Empresa' && user.sqlData?.empresa) {
    const e = user.sqlData.empresa;
    document.getElementById('empresaBlock').style.display = 'block';
    document.getElementById('nombreEmpresaInput').value = e.nombre_empresa || '';
    document.getElementById('nitInput').value = e.NIT || '';
    document.getElementById('direccionInput').value = e.direccion || '';
    document.getElementById('telefonoInput').value = e.telefono || '';
    document.getElementById('sitioWebInput').value = e.sitio_web || '';
    document.getElementById('descEmpresaInput').value = e.descripcion || '';
  }

  // datos ONG
  if (user.tipo_usuario === 'ONG' && user.sqlData?.ong) {
    const o = user.sqlData.ong;
    document.getElementById('ongBlock').style.display = 'block';
    document.getElementById('nombreOngInput').value = o.nombre_ong || '';
    document.getElementById('nitOngInput').value = o.NIT || '';
    document.getElementById('direccionOngInput').value = o.direccion || '';
    document.getElementById('telefonoOngInput').value = o.telefono || '';
    document.getElementById('sitioWebOngInput').value = o.sitio_web || '';
    document.getElementById('descOngInput').value = o.descripcion || '';
  }

  // datos Integrante externo
  if (user.tipo_usuario === 'Integrante externo' && user.sqlData?.integrante) {
    const i = user.sqlData.integrante;
    document.getElementById('integranteBlock').style.display = 'block';
    document.getElementById('nombresInput').value      = i.nombres || '';
    document.getElementById('apellidosInput').value    = i.apellidos || '';
    if (i.fecha_nacimiento) {
      document.getElementById('fechaNacInput').value =
        new Date(i.fecha_nacimiento).toISOString().split('T')[0];
    }
    document.getElementById('emailIntInput').value     = i.Email       || '';
    document.getElementById('phoneInput').value        = i.PhoneNumber || '';
    document.getElementById('descIntInput').value      = i.descripcion || '';
  }

  /* ── Preview en vivo del nuevo avatar ───── */
  document.getElementById('avatarInput').addEventListener('change', e => {
    const file = e.target.files[0];
    const img  = document.getElementById('avatarPreviewImg');
    const placeholder = document.getElementById('avatarPlaceholder');
    
    if (!file) { 
      img.style.display='none'; 
      placeholder.style.display='flex'; 
      img.src=''; 
      return; 
    }
    
    const fr = new FileReader();
    fr.onload = ev => { 
      img.src = ev.target.result; 
      img.style.display='block'; 
      placeholder.style.display='none';
    };
    fr.readAsDataURL(file);
  });

  /* ── Submit ─────────────────────────────── */
  document.getElementById('profileForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    showStatus('Guardando cambios...', 'loading');

    const fd = new FormData(ev.target);



   if (!fd.get('NIT')?.trim()) {
      fd.delete('NIT');
    }


    try {
      const res  = await fetch(`${API_BASE_URL}/api/users/profile`, {
        method : 'PUT',
        headers: { Authorization:`Bearer ${token}` },
        body   : fd
      });
      const out = await res.json();
      if (!res.ok || !out.success) throw new Error(out.error || 'Error');

      showStatus('¡Perfil actualizado exitosamente! ✓', 'success');

      // Actualizar nombre en localStorage si cambió
      if (out.user.nombre_usuario) {
        localStorage.setItem('nombre_usuario', out.user.nombre_usuario);
      }
    } catch (err) {
      showStatus('Error: ' + err.message, 'error');
    }
  });
})();
</script>
</body>
</html>
