<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Empresa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand': {
              'profundo': '#3883D3',
              'turquesa': '#21BFC4', 
              'verde': '#36C974',
              'claro': '#F9F9F9'
            }
          }
        }
      }
    }
  </script>
  <script src="../../assets/js/config.js"></script>
  <script defer src="../../scripts/auth/register-empresa.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-brand-claro via-white to-brand-claro">
  <div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-brand-profundo to-brand-turquesa rounded-full mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-gray-800 mb-2">Registro de Empresa</h1>
      <p class="text-gray-600">Únete a nuestra plataforma y haz crecer tu negocio</p>
    </div>

    <!-- Form Container -->
    <div class="max-w-4xl mx-auto">
      <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        <!-- Form Header -->
        <div class="bg-gradient-to-r from-brand-profundo via-brand-turquesa to-brand-verde p-6">
          <h2 class="text-xl font-semibold text-white text-center">Información de la Empresa</h2>
        </div>

        <!-- Form Body -->
        <div class="p-8">
          <form id="formEmpresa" class="space-y-6">
            <!-- Grid Layout for Form Fields -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              
              <!-- Información de Usuario -->
              <div class="lg:col-span-2">
                <h3 class="text-lg font-semibold text-gray-800 mb-4 pb-2 border-b-2 border-brand-turquesa">
                  Información del Usuario
                </h3>
              </div>

              <!-- Nombre de Usuario -->
              <div class="space-y-2">
                <label for="nombre_usuario" class="block text-sm font-medium text-gray-700">
                  Nombre de Usuario *
                </label>
                <div class="relative">
                  <input
                    type="text"
                    id="nombre_usuario"
                    name="nombre_usuario"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-profundo focus:border-transparent transition-all duration-200 pl-11"
                    placeholder="usuario123"
                  >
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Correo -->
              <div class="space-y-2">
                <label for="correo" class="block text-sm font-medium text-gray-700">
                  Correo Electrónico *
                </label>
                <div class="relative">
                  <input
                    type="email"
                    id="correo"
                    name="correo"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-profundo focus:border-transparent transition-all duration-200 pl-11"
                    placeholder="empresa@ejemplo.com"
                  >
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Contraseña -->
              <div class="lg:col-span-2 space-y-2">
                <label for="contrasena" class="block text-sm font-medium text-gray-700">
                  Contraseña *
                </label>
                <div class="relative">
                  <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-profundo focus:border-transparent transition-all duration-200 pl-11"
                    placeholder="••••••••"
                  >
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Información de la Empresa -->
              <div class="lg:col-span-2 mt-8">
                <h3 class="text-lg font-semibold text-gray-800 mb-4 pb-2 border-b-2 border-brand-verde">
                  Información de la Empresa
                </h3>
              </div>

              <!-- Nombre de la Empresa -->
              <div class="space-y-2">
                <label for="nombre_empresa" class="block text-sm font-medium text-gray-700">
                  Nombre de la Empresa *
                </label>
                <input
                  type="text"
                  id="nombre_empresa"
                  name="nombre_empresa"
                  required
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-verde focus:border-transparent transition-all duration-200"
                  placeholder="Nombre comercial"
                >
              </div>

              <!-- Razón Social -->
              <div class="space-y-2">
                <label for="razon_social" class="block text-sm font-medium text-gray-700">
                  Razón Social *
                </label>
                <input
                  type="text"
                  id="razon_social"
                  name="razon_social"
                  required
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-verde focus:border-transparent transition-all duration-200"
                  placeholder="Razón social completa"
                >
              </div>

              <!-- NIT -->
              <div class="space-y-2">
                <label for="NIT" class="block text-sm font-medium text-gray-700">
                  NIT *
                </label>
                <input
                  type="text"
                  id="NIT"
                  name="NIT"
                  required
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-turquesa focus:border-transparent transition-all duration-200"
                  placeholder="123456789-0"
                >
              </div>

              <!-- Teléfono -->
              <div class="space-y-2">
                <label for="telefono" class="block text-sm font-medium text-gray-700">
                  Teléfono *
                </label>
                <div class="relative">
                  <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-turquesa focus:border-transparent transition-all duration-200 pl-11"
                    placeholder="+57 300 123 4567"
                  >
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Dirección -->
              <div class="lg:col-span-2 space-y-2">
                <label for="direccion" class="block text-sm font-medium text-gray-700">
                  Dirección *
                </label>
                <div class="relative">
                  <input
                    type="text"
                    id="direccion"
                    name="direccion"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-turquesa focus:border-transparent transition-all duration-200 pl-11"
                    placeholder="Calle 123 #45-67, Ciudad, Departamento"
                  >
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Sitio Web (Opcional) -->
              <div class="space-y-2">
                <label for="sitio_web" class="block text-sm font-medium text-gray-700">
                  Sitio Web <span class="text-gray-400">(Opcional)</span>
                </label>
                <div class="relative">
                  <input
                    type="url"
                    id="sitio_web"
                    name="sitio_web"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-verde focus:border-transparent transition-all duration-200 pl-11"
                    placeholder="https://www.miempresa.com"
                  >
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9v-9m0-9v9"></path>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Descripción (Opcional) -->
              <div class="lg:col-span-2 space-y-2">
                <label for="descripcion" class="block text-sm font-medium text-gray-700">
                  Descripción de la Empresa <span class="text-gray-400">(Opcional)</span>
                </label>
                <textarea
                  id="descripcion"
                  name="descripcion"
                  rows="4"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-verde focus:border-transparent transition-all duration-200 resize-none"
                  placeholder="Describe brevemente tu empresa, servicios o productos..."
                ></textarea>
              </div>
            </div>

            <!-- Message Display -->
            <div id="msg" class="text-center py-2"></div>

            <!-- Submit Button -->
            <div class="pt-6">
              <button
                type="submit"
                class="w-full bg-gradient-to-r from-brand-profundo via-brand-turquesa to-brand-verde hover:from-brand-turquesa hover:via-brand-verde hover:to-brand-profundo text-white font-semibold py-4 px-6 rounded-lg transition-all duration-300 transform hover:scale-[1.02] hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-brand-profundo focus:ring-offset-2"
              >
                <span class="flex items-center justify-center">
                  <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                  </svg>
                  Registrar Empresa
                </span>
              </button>
            </div>

            <!-- Footer Links -->
            <div class="text-center pt-4 border-t border-gray-200">
              <p class="text-sm text-gray-600">
                ¿Ya tienes una cuenta? 
                <a href="../login.html" class="text-brand-profundo hover:text-brand-turquesa font-medium transition-colors duration-200">
                  Inicia sesión aquí
                </a>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Additional Styling for Enhanced Visual Appeal -->
  <style>
    .container {
      animation: fadeIn 0.6s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    input:focus, textarea:focus {
      box-shadow: 0 0 0 3px rgba(56, 131, 211, 0.1);
    }
    
    .form-section {
      transition: all 0.3s ease;
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    /* Custom scrollbar for textarea */
    textarea::-webkit-scrollbar {
      width: 6px;
    }
    
    textarea::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }
    
    textarea::-webkit-scrollbar-thumb {
      background: #3883D3;
      border-radius: 3px;
    }
  </style>
</body>
</html>
