<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro • Integrante Externo</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../assets/js/tailwind-global.js"></script>
  <link rel="stylesheet" href="../../assets/css/styles.css" />

  <!-- Config (API_BASE_URL) y script específico -->
  <script src="../../assets/js/config.js"></script>
  <script defer src="../../scripts/auth/register-user-ext.js"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 overflow-hidden">

  <!-- Contenedor principal -->
  <div class="w-full max-w-7xl h-screen flex items-center justify-center relative">
    
    <!-- Tarjeta principal con diseño asimétrico -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-6xl h-[90vh] flex overflow-hidden relative animate-slideIn">
      
      <!-- Lado derecho - Sección de bienvenida (cambiado de posición) -->
      <div class="hidden lg:flex lg:w-2/5 relative">
        <!-- Imagen de fondo con overlay -->
        <div class="absolute inset-0 rounded-3xl overflow-hidden">
          <!-- Imagen de fondo de comunidad -->
          <div class="absolute inset-0 bg-cover bg-center opacity-50" 
               style="background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAwIiBoZWlnaHQ9IjgwMCIgdmlld0JveD0iMCAwIDYwMCA4MDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxkZWZzPgo8cGF0dGVybiBpZD0iY29tbXVuaXR5UGF0dGVybiIgcGF0dGVyblVuaXRzPSJ1c2VyU3BhY2VPblVzZSIgd2lkdGg9IjEyMCIgaGVpZ2h0PSIxMjAiPgo8cmVjdCB3aWR0aD0iMTIwIiBoZWlnaHQ9IjEyMCIgZmlsbD0iIzY1YzUzNCIgZmlsbC1vcGFjaXR5PSIwLjA4Ii8+CjxyZWN0IHg9IjE1IiB5PSIxNSIgd2lkdGg9IjkwIiBoZWlnaHQ9IjkwIiBmaWxsPSIjZmZmZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDMiIHJ4PSI4Ii8+CjxyZWN0IHg9IjMwIiB5PSIzMCIgd2lkdGg9IjE1IiBoZWlnaHQ9IjE1IiBmaWxsPSIjMGY3Mzg5IiBmaWxsLW9wYWNpdHk9IjAuMTUiIHJ4PSIzIi8+CjxyZWN0IHg9IjUwIiB5PSIzMCIgd2lkdGg9IjE1IiBoZWlnaHQ9IjE1IiBmaWxsPSIjNjVjNTM0IiBmaWxsLW9wYWNpdHk9IjAuMTUiIHJ4PSIzIi8+CjxyZWN0IHg9IjcwIiB5PSIzMCIgd2lkdGg9IjE1IiBoZWlnaHQ9IjE1IiBmaWxsPSIjMGY3Mzg5IiBmaWxsLW9wYWNpdHk9IjAuMTUiIHJ4PSIzIi8+CjxjaXJjbGUgY3g9IjM3IiBjeT0iNjAiIHI9IjgiIGZpbGw9IiM2NWM1MzQiIGZpbGwtb3BhY2l0eT0iMC4xIi8+CjxjaXJjbGUgY3g9IjU3IiBjeT0iNjAiIHI9IjgiIGZpbGw9IiMwZjczODkiIGZpbGwtb3BhY2l0eT0iMC4xIi8+CjxjaXJjbGUgY3g9Ijc3IiBjeT0iNjAiIHI9IjgiIGZpbGw9IiM2NWM1MzQiIGZpbGwtb3BhY2l0eT0iMC4xIi8+CjwvcGF0dGVybj4KPC9kZWZzPgo8cmVjdCB3aWR0aD0iNjAwIiBoZWlnaHQ9IjgwMCIgZmlsbD0idXJsKCNjb21tdW5pdHlQYXR0ZXJuKSIvPgo8L3N2Zz4=');">
          </div>
          
          <!-- Overlay con gradiente (colores diferentes) -->
          <div class="absolute inset-0 bg-gradient-to-tl from-green-500/85 via-cyan-500/85 to-blue-500/85"></div>
          
          <!-- Efecto de desenfoque en los bordes -->
          <div class="absolute inset-0 backdrop-blur-sm"></div>
        </div>
        
        <!-- Contenido principal -->
        <div class="relative inset-0 flex flex-col justify-center items-center text-white overflow-hidden z-10">
          
          <!-- Círculos decorativos flotantes (diferentes posiciones) -->
          <div class="absolute -top-20 -left-32 w-80 h-80 bg-white/8 rounded-full animate-float-reverse"></div>
          <div class="absolute -bottom-32 -right-20 w-96 h-96 bg-white/5 rounded-full animate-float-slow" style="animation-delay: 1.5s;"></div>
          <div class="absolute top-1/3 right-1/4 w-40 h-40 bg-white/6 rounded-full animate-drift-reverse" style="animation-delay: 0.8s;"></div>
          
          <!-- Contenido de texto -->
          <div class="text-center z-20 px-8 animate-slideInLeft">
            <h2 class="text-4xl lg:text-5xl font-bold mb-6 animate-pulse-gentle drop-shadow-lg">¡Únete a nosotros!</h2>
            <p class="text-lg lg:text-xl mb-8 text-white/95 leading-relaxed drop-shadow-md">
              Regístrate como integrante externo<br>
              y forma parte de nuestra comunidad
            </p>
            
            <div class="border-2 border-white/80 text-white hover:bg-white/20 hover:border-white font-semibold py-3 px-8 rounded-2xl transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-white/30 cursor-pointer backdrop-blur-sm">
              Juntos por un mundo mejor
            </div>
          </div>

          <!-- Logo UNI2 en el fondo -->
          <div class="absolute top-8 left-8 opacity-15 animate-float-gentle">
            <img src="/assets/img/UNI2.png" alt="UNI2 Logo" class="w-28 h-28 object-contain animate-pulse-gentle filter brightness-0 invert">
          </div>
          
          <!-- Elementos geométricos flotantes (diferentes formas) -->
          <div class="absolute top-1/4 right-20 w-6 h-6 bg-white/25 rounded-full animate-bounce-slow"></div>
          <div class="absolute bottom-1/4 left-16 w-4 h-4 bg-white/20 rounded-square animate-pulse-slow"></div>
          <div class="absolute top-1/2 right-12 w-3 h-3 bg-white/30 rounded-full animate-twinkle-fast"></div>
          <div class="absolute bottom-1/3 left-1/3 w-2 h-2 bg-white/35 rounded-full animate-orbit"></div>
          <div class="absolute top-3/4 right-1/4 w-5 h-5 bg-white/15 rounded-full animate-wave"></div>
        </div>
      </div>

      <!-- Lado izquierdo - Formulario -->
      <div class="w-full lg:w-3/5 p-6 lg:p-10 flex flex-col justify-start relative z-10 overflow-y-auto">
        
        <!-- Logo UNI2 pequeño en la esquina -->
        <div class="absolute top-6 right-6 animate-fadeIn">
          <img src="/assets/img/UNI2.png" alt="UNI2 Logo" class="w-12 h-12 object-contain animate-rotate-slow">
        </div>

        <!-- Título principal -->
        <div class="mt-16 mb-6 animate-slideInRight" style="animation-delay: 0.2s;">
          <h1 class="text-3xl lg:text-4xl font-bold text-gray-900 mb-2">Crear cuenta de Integrante Externo</h1>
        </div>

        <!-- Formulario -->
        <div class="flex-1 animate-slideInRight" style="animation-delay: 0.4s;">
          <form id="formRegister" class="space-y-6">
            <!-- Datos de acceso -->
            <fieldset class="grid grid-cols-1 sm:grid-cols-2 gap-4 animate-slideInUp" style="animation-delay: 0.6s;">
              <legend class="sr-only">Datos de acceso</legend>
              
              <!-- Indicador de sección -->
              <div class="sm:col-span-2 flex items-center space-x-3 mb-4">
                <div class="flex items-center justify-center w-8 h-8 bg-green-100 rounded-full animate-pulse-gentle">
                  <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                </div>
                <h2 class="text-lg font-semibold text-gray-800">Datos de acceso</h2>
              </div>

              <div class="animate-fadeInUp" style="animation-delay: 0.8s;">
                <label for="nombre_usuario" class="block text-sm font-medium mb-1">Usuario*</label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 flex items-center pl-4">
                    <svg class="w-4 h-4 text-gray-400 animate-wiggle-soft" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                  </div>
                  <input id="nombre_usuario" name="nombre_usuario" type="text" required
                         placeholder="juan_perez2023"
                         class="input-field-custom pl-12">
                </div>
              </div>

              <div class="animate-fadeInUp" style="animation-delay: 1s;">
                <label for="correo" class="block text-sm font-medium mb-1">Correo*</label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 flex items-center pl-4">
                    <svg class="w-4 h-4 text-gray-400 animate-wiggle-soft" style="animation-delay: 0.2s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.826a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                  </div>
                  <input id="correo" name="correo" type="email" required
                         placeholder="juan.perez@example.com"
                         class="input-field-custom pl-12">
                </div>
              </div>

              <div class="sm:col-span-2 animate-fadeInUp" style="animation-delay: 1.2s;">
                <label for="contrasena" class="block text-sm font-medium mb-1">Contraseña*</label>
                <div class="relative">
                  <div class="absolute inset-y-0 left-0 flex items-center pl-4">
                    <svg class="w-4 h-4 text-gray-400 animate-wiggle-soft" style="animation-delay: 0.4s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                  </div>
                  <input id="contrasena" name="contrasena" type="password" required minlength="8"
                         placeholder="SecurePass123!"
                         class="input-field-custom pl-12">
                </div>
              </div>
            </fieldset>

            <hr class="border-gray-200 animate-expand-horizontal" style="animation-delay: 1.4s;">

            <!-- Datos personales -->
            <fieldset class="grid grid-cols-1 sm:grid-cols-2 gap-4 animate-slideInUp" style="animation-delay: 1.6s;">
              <legend class="sr-only">Datos personales</legend>
              
              <!-- Indicador de sección -->
              <div class="sm:col-span-2 flex items-center space-x-3 mb-4">
                <div class="flex items-center justify-center w-8 h-8 bg-cyan-100 rounded-full animate-pulse-gentle" style="animation-delay: 0.5s;">
                  <svg class="w-4 h-4 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                  </svg>
                </div>
                <h2 class="text-lg font-semibold text-gray-800">Datos personales</h2>
              </div>

              <div class="animate-fadeInUp" style="animation-delay: 1.8s;">
                <label for="nombres" class="block text-sm font-medium mb-1">Nombres*</label>
                <input id="nombres" name="nombres" type="text" required
                       placeholder="Juan Carlos"
                       class="input-field-custom">
              </div>

              <div class="animate-fadeInUp" style="animation-delay: 2s;">
                <label for="apellidos" class="block text-sm font-medium mb-1">Apellidos*</label>
                <input id="apellidos" name="apellidos" type="text" required
                       placeholder="Pérez García"
                       class="input-field-custom">
              </div>

              <div class="animate-fadeInUp" style="animation-delay: 2.2s;">
                <label for="documento_identidad" class="block text-sm font-medium mb-1">Documento de identidad*</label>
                <input id="documento_identidad" name="documento_identidad" type="text" required
                       placeholder="1234567890"
                       class="input-field-custom">
              </div>

              <div class="animate-fadeInUp" style="animation-delay: 2.4s;">
                <label for="telefono" class="block text-sm font-medium mb-1">Teléfono*</label>
                <input id="telefono" name="telefono" type="text" required
                       placeholder="+573001234567"
                       class="input-field-custom">
              </div>

              <div class="sm:col-span-2 animate-fadeInUp" style="animation-delay: 2.6s;">
                <label for="direccion" class="block text-sm font-medium mb-1">Dirección*</label>
                <input id="direccion" name="direccion" type="text" required
                       placeholder="Calle 123 #45-67, Bogotá"
                       class="input-field-custom">
              </div>

              <div class="sm:col-span-2 animate-fadeInUp" style="animation-delay: 2.8s;">
                <label for="fecha_nacimiento" class="block text-sm font-medium mb-1">Fecha de nacimiento*</label>
                <input id="fecha_nacimiento" name="fecha_nacimiento" type="date" required
                       class="input-field-custom">
              </div>
            </fieldset>

            <p id="msg" class="text-sm text-center text-red-500 h-5 animate-fadeIn" style="animation-delay: 3s;"></p>

            <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-green-500 to-cyan-500 hover:from-green-600 hover:to-cyan-600 text-white font-semibold rounded-2xl shadow-lg
                           focus:outline-none focus:ring-4 focus:ring-green-300/50 transition-all duration-300
                           transform hover:scale-105 hover:-translate-y-1 animate-glow-green animate-fadeInUp" style="animation-delay: 3.2s;">
              <span class="flex items-center justify-center space-x-2">
                <svg class="w-5 h-5 animate-bounce-gentle" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
                <span>Registrar cuenta</span>
              </span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Estilos personalizados -->
  <style>
    .input-field-custom {
      @apply w-full px-4 py-3 border-2 border-gray-200 rounded-2xl bg-white
             placeholder-gray-500 text-gray-700 shadow-sm
             focus:border-green-400 focus:ring-4 focus:ring-green-100 focus:bg-white
             transition-all duration-300 outline-none font-medium;
    }
    
    .input-field-custom:focus {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(34, 197, 94, 0.2);
      border-color: #22c55e;
    }
    
    .input-field-custom:hover {
      border-color: #4ade80;
      transform: translateY(-1px);
      box-shadow: 0 5px 15px rgba(34, 197, 94, 0.1);
    }

    .input-field-custom::placeholder {
      color: #9ca3af;
      font-weight: 400;
    }

    /* Nuevas animaciones personalizadas */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(40px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounceGentle {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes bounceSlow {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    @keyframes pulseGentle {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.05);
        opacity: 0.8;
      }
    }

    @keyframes pulseSlow {
      0%, 100% {
        opacity: 0.4;
      }
      50% {
        opacity: 0.8;
      }
    }

    @keyframes wiggleSoft {
      0%, 100% {
        transform: rotate(0deg);
      }
      25% {
        transform: rotate(-1deg);
      }
      75% {
        transform: rotate(1deg);
      }
    }

    @keyframes glowGreen {
      0%, 100% {
        box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
      }
      50% {
        box-shadow: 0 8px 30px rgba(34, 197, 94, 0.6);
      }
    }

    @keyframes rotateSlow {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes expandHorizontal {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }

    @keyframes floatReverse {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      33% {
        transform: translateY(8px) rotate(-1deg);
      }
      66% {
        transform: translateY(-12px) rotate(1deg);
      }
    }

    @keyframes floatGentle {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes floatSlow {
      0%, 100% {
        transform: translateY(0px) translateX(0px);
      }
      33% {
        transform: translateY(-8px) translateX(3px);
      }
      66% {
        transform: translateY(4px) translateX(-3px);
      }
    }

    @keyframes driftReverse {
      0%, 100% {
        transform: translateX(0px) translateY(0px);
      }
      25% {
        transform: translateX(-6px) translateY(4px);
      }
      50% {
        transform: translateX(4px) translateY(-6px);
      }
      75% {
        transform: translateX(-3px) translateY(-2px);
      }
    }

    @keyframes twinkleFast {
      0%, 100% {
        opacity: 0.2;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    @keyframes orbit {
      0% {
        transform: rotate(0deg) translateX(20px) rotate(0deg);
      }
      100% {
        transform: rotate(360deg) translateX(20px) rotate(-360deg);
      }
    }

    @keyframes wave {
      0%, 100% {
        transform: translateY(0px);
      }
      25% {
        transform: translateY(-3px);
      }
      50% {
        transform: translateY(0px);
      }
      75% {
        transform: translateY(3px);
      }
    }

    /* Clases de animación */
    .animate-slideIn {
      animation: slideIn 0.8s ease-out;
    }

    .animate-slideInLeft {
      animation: slideInLeft 0.7s ease-out;
    }

    .animate-slideInRight {
      animation: slideInRight 0.7s ease-out;
    }

    .animate-slideInUp {
      animation: slideInUp 0.6s ease-out;
    }

    .animate-fadeIn {
      animation: fadeIn 0.6s ease-out;
    }

    .animate-fadeInUp {
      animation: fadeInUp 0.5s ease-out;
    }

    .animate-bounce-gentle {
      animation: bounceGentle 2.5s ease-in-out infinite;
    }

    .animate-bounce-slow {
      animation: bounceSlow 3s ease-in-out infinite;
    }

    .animate-pulse-gentle {
      animation: pulseGentle 2s ease-in-out infinite;
    }

    .animate-pulse-slow {
      animation: pulseSlow 3s ease-in-out infinite;
    }

    .animate-wiggle-soft {
      animation: wiggleSoft 3s ease-in-out infinite;
    }

    .animate-glow-green {
      animation: glowGreen 2.5s ease-in-out infinite;
    }

    .animate-rotate-slow {
      animation: rotateSlow 8s linear infinite;
    }

    .animate-expand-horizontal {
      animation: expandHorizontal 1s ease-out;
    }

    .animate-float-reverse {
      animation: floatReverse 7s ease-in-out infinite;
    }

    .animate-float-gentle {
      animation: floatGentle 4s ease-in-out infinite;
    }

    .animate-float-slow {
      animation: floatSlow 5s ease-in-out infinite;
    }

    .animate-drift-reverse {
      animation: driftReverse 8s ease-in-out infinite;
    }

    .animate-twinkle-fast {
      animation: twinkleFast 1s ease-in-out infinite;
    }

    .animate-orbit {
      animation: orbit 10s linear infinite;
    }

    .animate-wave {
      animation: wave 2s ease-in-out infinite;
    }

    /* Gradiente de fondo */
    body {
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
    }

    /* Scroll personalizado */
    .overflow-y-auto::-webkit-scrollbar {
      width: 6px;
    }

    .overflow-y-auto::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    .overflow-y-auto::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 10px;
    }

    .overflow-y-auto::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .lg\:w-2\/5 {
        display: none;
      }
      .lg\:w-3\/5 {
        width: 100%;
      }
    }

    /* Forma cuadrada para algunos elementos */
    .rounded-square {
      border-radius: 2px;
    }
  </style>
</body>
</html>
