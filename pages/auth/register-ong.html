<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro • ONG</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-profundo': '#3883D3',
            'brand-cyan': '#21BFC4',
            'brand-verde': '#36C974',
            'brand-claro': '#F9F9F9'
          }
        }
      }
    }
  </script>

  <!-- Scripts -->
  <script src="../../assets/js/config.js"></script>
  <script defer src="../../scripts/auth/register-ong.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-brand-profundo via-brand-cyan to-brand-verde p-4">
  
  <!-- Contenedor principal -->
  <div class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-4xl">
      
      <!-- Header con logo/título -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-full shadow-lg mb-4">
          <i class="fas fa-hands-helping text-3xl text-brand-profundo"></i>
        </div>
        <h1 class="text-4xl font-bold text-white mb-2">Registro de ONG</h1>
        <p class="text-brand-claro/80 text-lg">Únete a nuestra comunidad solidaria</p>
      </div>

      <!-- Tarjeta principal -->
      <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-8 border border-white/20">
        
        <form id="formOng" class="space-y-8">
          
          <!-- Sección 1: Datos de Acceso -->
          <div class="relative">
            <div class="flex items-center mb-6">
              <div class="flex items-center justify-center w-10 h-10 bg-brand-profundo rounded-full mr-4">
                <i class="fas fa-key text-white"></i>
              </div>
              <h2 class="text-xl font-semibold text-gray-800">Datos de Acceso</h2>
              <div class="flex-1 h-px bg-gradient-to-r from-brand-profundo/20 to-transparent ml-4"></div>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div class="space-y-2">
                <label for="nombre_usuario" class="flex items-center text-sm font-medium text-gray-700">
                  <i class="fas fa-user w-4 mr-2 text-brand-profundo"></i>
                  Usuario *
                </label>
                <input id="nombre_usuario" name="nombre_usuario" type="text" required
                       placeholder="fundacion_vida2025"
                       class="w-full px-4 py-3 bg-brand-claro/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-profundo focus:border-transparent transition-all duration-200 hover:bg-white/80">
              </div>

              <div class="space-y-2">
                <label for="correo" class="flex items-center text-sm font-medium text-gray-700">
                  <i class="fas fa-envelope w-4 mr-2 text-brand-profundo"></i>
                  Correo Electrónico *
                </label>
                <input id="correo" name="correo" type="email" required
                       placeholder="contacto@fundacionvida.org"
                       class="w-full px-4 py-3 bg-brand-claro/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-profundo focus:border-transparent transition-all duration-200 hover:bg-white/80">
              </div>

              <div class="lg:col-span-2 space-y-2">
                <label for="contrasena" class="flex items-center text-sm font-medium text-gray-700">
                  <i class="fas fa-lock w-4 mr-2 text-brand-profundo"></i>
                  Contraseña *
                </label>
                <input id="contrasena" name="contrasena" type="password" minlength="8" required
                       placeholder="ClaveSegura!2025"
                       class="w-full px-4 py-3 bg-brand-claro/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-profundo focus:border-transparent transition-all duration-200 hover:bg-white/80">
              </div>
            </div>
          </div>

          <!-- Separador -->
          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gradient-to-r from-brand-profundo/20 via-brand-cyan/20 to-brand-verde/20"></div>
            </div>
            <div class="relative flex justify-center">
              <span class="bg-white px-4 text-sm text-gray-500">Información de la ONG</span>
            </div>
          </div>

          <!-- Sección 2: Datos de la ONG -->
          <div class="relative">
            <div class="flex items-center mb-6">
              <div class="flex items-center justify-center w-10 h-10 bg-brand-cyan rounded-full mr-4">
                <i class="fas fa-building text-white"></i>
              </div>
              <h2 class="text-xl font-semibold text-gray-800">Información Organizacional</h2>
              <div class="flex-1 h-px bg-gradient-to-r from-brand-cyan/20 to-transparent ml-4"></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div class="lg:col-span-2 space-y-2">
                <label for="nombre_ong" class="flex items-center text-sm font-medium text-gray-700">
                  <i class="fas fa-heart w-4 mr-2 text-brand-cyan"></i>
                  Nombre de la ONG *
                </label>
                <input id="nombre_ong" name="nombre_ong" type="text" required
                       placeholder="Fundación Vida"
                       class="w-full px-4 py-3 bg-brand-claro/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-cyan focus:border-transparent transition-all duration-200 hover:bg-white/80">
              </div>

              <div class="space-y-2">
                <label for="NIT" class="flex items-center text-sm font-medium text-gray-700">
                  <i class="fas fa-id-card w-4 mr-2 text-brand-cyan"></i>
                  NIT *
                </label>
                <input id="NIT" name="NIT" type="text" required
                       placeholder="800123456-7"
                       class="w-full px-4 py-3 bg-brand-claro/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-cyan focus:border-transparent transition-all duration-200 hover:bg-white/80">
              </div>

              <div class="space-y-2">
                <label for="telefono" class="flex items-center text-sm font-medium text-gray-700">
                  <i class="fas fa-phone w-4 mr-2 text-brand-cyan"></i>
                  Teléfono *
                </label>
                <input id="telefono" name="telefono" type="text" required
                       placeholder="+57 (1) 234 5678"
                       class="w-full px-4 py-3 bg-brand-claro/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-cyan focus:border-transparent transition-all duration-200 hover:bg-white/80">
              </div>

              <div class="lg:col-span-2 space-y-2">
                <label for="sitio_web" class="flex items-center text-sm font-medium text-gray-700">
                  <i class="fas fa-globe w-4 mr-2 text-brand-cyan"></i>
                  Sitio Web
                </label>
                <input id="sitio_web" name="sitio_web" type="url"
                       placeholder="https://fundacionvida.org"
                       class="w-full px-4 py-3 bg-brand-claro/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-cyan focus:border-transparent transition-all duration-200 hover:bg-white/80">
              </div>

              <div class="lg:col-span-2 space-y-2">
                <label for="descripcion" class="flex items-center text-sm font-medium text-gray-700">
                  <i class="fas fa-align-left w-4 mr-2 text-brand-cyan"></i>
                  Descripción
                </label>
                <textarea id="descripcion" name="descripcion" rows="4"
                          placeholder="Cuéntanos brevemente la misión de tu ONG..."
                          class="w-full px-4 py-3 bg-brand-claro/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-cyan focus:border-transparent transition-all duration-200 hover:bg-white/80 resize-none"></textarea>
              </div>
            </div>
          </div>

          <!-- Sección 3: Ubicación -->
          <div class="relative">
            <div class="flex items-center mb-6">
              <div class="flex items-center justify-center w-10 h-10 bg-brand-verde rounded-full mr-4">
                <i class="fas fa-map-marker-alt text-white"></i>
              </div>
              <h2 class="text-xl font-semibold text-gray-800">Ubicación</h2>
              <div class="flex-1 h-px bg-gradient-to-r from-brand-verde/20 to-transparent ml-4"></div>
            </div>

            <div class="space-y-4">
              <div class="space-y-2">
                <label for="direccion" class="flex items-center text-sm font-medium text-gray-700">
                  <i class="fas fa-map-pin w-4 mr-2 text-brand-verde"></i>
                  Dirección *
                </label>
                <input id="direccion" name="direccion" type="text" required
                       placeholder="Selecciona en el mapa..."
                       class="w-full px-4 py-3 bg-brand-claro/50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-verde focus:border-transparent transition-all duration-200 hover:bg-white/80">
              </div>

              <div class="bg-gradient-to-br from-brand-profundo/5 to-brand-cyan/5 p-4 rounded-xl border border-gray-200">
                <div id="map" class="w-full h-80 rounded-lg shadow-inner border-2 border-white"></div>
                <div class="flex items-center mt-3 text-sm text-gray-600">
                  <i class="fas fa-info-circle mr-2 text-brand-verde"></i>
                  Haz clic en el mapa para ubicar tu ONG
                </div>
              </div>
            </div>
          </div>

          <!-- Mensaje de estado -->
          <div class="text-center">
            <p id="msg" class="text-sm font-medium h-6"></p>
          </div>

          <!-- Botón de envío -->
          <div class="pt-4">
            <button type="submit"
                    class="w-full py-4 bg-gradient-to-r from-brand-profundo via-brand-cyan to-brand-verde text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transform hover:scale-[1.02] focus:outline-none focus:ring-4 focus:ring-brand-profundo/30 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
              <i class="fas fa-paper-plane mr-2"></i>
              Registrar ONG
            </button>
          </div>

          <!-- Enlaces adicionales -->
          <div class="text-center pt-4 border-t border-gray-200">
            <p class="text-sm text-gray-600">
              ¿Ya tienes una cuenta? 
              <a href="../login.html" class="text-brand-profundo hover:text-brand-cyan font-medium transition-colors">
                Inicia sesión aquí
              </a>
            </p>
          </div>

        </form>
      </div>

      <!-- Footer -->
      <div class="text-center mt-8">
        <p class="text-brand-claro/70 text-sm">
          © 2025 Plataforma Solidaria. Conectando corazones, transformando vidas.
        </p>
      </div>

    </div>
  </div>

</body>
</html>
